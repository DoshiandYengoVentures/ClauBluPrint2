<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Client Login | DYD</title>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Our Supabase configuration -->
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      color: #111827;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #6b7280;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="login-box">

    <h1>Client Portal</h1>

    <p class="subtitle">
      Sign in to your DYD account.
    </p>

    <form id="login-form">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Your password"
        required
      >

      <button type="submit">
        Sign In
      </button>

    </form>

    <div id="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </div>

  </main>

  <script>

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "Signing in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.textContent = error.message;

        return;
      }

      window.location.href = "portal.html";

    });

  </script>

</body>
</html>
